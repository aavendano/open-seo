# Railway deploy for Docker self-hosting (hosted auth + optional Postgres).
# Connect this repo in Railway → OpenSEO service, set variables per docs/RAILWAY.md.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.selfhost"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
startCommand = "sh docker-entrypoint.sh"
